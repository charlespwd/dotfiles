font_family        Cousine NF
bold_font          Cousine NF Bold
italic_font        Cousine NF Italic
bold_italic_font   Cousine NF Bold Italic
font_size          16.0

# macos
macos_thicken_font 0.5
macos_traditional_fullscreen yes
# hide_window_decorations     titlebar-only

# gruvbox-dark colorscheme for kitty
# snazzy theme used as base

foreground            #ebdbb2
background            #282828
selection_foreground  #655b53
selection_background  #ebdbb2
url_color             #d65c0d

# black
color0   #272727
color8   #928373

# red
color1   #cc231c
color9   #fb4833

# green
color2   #989719
color10  #b8ba25

# yellow
color3   #d79920
color11  #fabc2e

# blue
color4  #448488
color12 #83a597

# magenta
color5   #b16185
color13  #d3859a

# cyan
color6   #689d69
color14  #8ec07b

# white
color7   #a89983
color15  #ebdbb2

# --- Link handling ---

# Open detected URLs in Chrome by default
open_url_with /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

# Cmd+click opens links (faster than plain click, no click_interval delay)
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link

# --- Hints (keyboard-triggered, works on plain text) ---

# Cmd+Shift+U → highlight URLs, pick one to open in Chrome
map cmd+shift+u kitten hints --type=url --program "open -a 'Google Chrome'"

# Cmd+Shift+E → highlight file paths (absolute/relative/bare), open in VS Code
map cmd+shift+e kitten hints --type=regex --regex '(?<![/\w.])(?:(?:[.~]/|\$\w+/)*(?:[\w.-]+/)+[\w.-]+|\w[\w.-]*\.\w+)' --program "/Users/charles/bin/open-in-vscode"

# Cmd+Shift+G → highlight file:line patterns (grep output, errors), open in VS Code at line
map cmd+shift+g kitten hints --type=linenum --linenum-action=background "/Users/charles/bin/open-in-vscode" --goto {path}:{line}
