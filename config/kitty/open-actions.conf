# File paths with line numbers (fragment) → VS Code at line
protocol file
fragment_matches [0-9]+
action launch --type=background code --goto ${FILE_PATH}:${FRAGMENT}

# File paths without line numbers → VS Code
protocol file
action launch --type=background open -a "Visual Studio Code" -- ${FILE_PATH}

# HTTP(S) URLs → Chrome
protocol https,http
action launch --type=background open -a "Google Chrome" -- ${URL}
